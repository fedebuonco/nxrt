name: Linux (Steam Deck target)

on:
  push:
    branches: [steam_deck]
  pull_request:
    branches: [steam_deck]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:25.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install build dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            clang lld make python3 pkg-config \
            libsdl3-dev libsdl3-image-dev \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libvulkan-dev libshaderc-dev libvulkan-memory-allocator-dev
      - name: Build the template runtime
        run: make -C examples/game-template -j2
      - name: Smoke-test the CLI
        run: |
          NXRT_LOG=info NXRT_NO_LAUNCHER=1 examples/game-template/build/templaterecomp --describe \
            | grep -q '"nxrt_describe":1'
